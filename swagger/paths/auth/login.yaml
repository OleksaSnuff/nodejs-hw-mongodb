tags:
  - Auth
summary: Login user
operationId: loginUser
description: Login registred user
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: 'User email'
            type: string
            example: alex1331park@gmail.com
          password:
            description: 'User password'
            type: string
            example: '12345678'
responses:
  '200':
    description: 'Successfully login user!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'You`ve been successfully logged in!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  description: 'The access token to account'
                  example: 'r+IhxqOAYKoqti5ZaGByw9ls2k016pQQDkfMfNVu'
  '400':
    $ref: ../../components/responses/400.yaml
